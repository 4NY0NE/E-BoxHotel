name: Build apps (APK e EXE)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar projeto Capacitor
        run: |
          mkdir -p cap/www
          cp -r index.html manifest.webmanifest assets src vendor cap/www/
          cd cap
          cat > package.json <<'EOF'
          {"name":"eboxhotel-android","version":"1.0.0","private":true}
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.hotelbox.app",
            "appName": "E-BoxHotel",
            "webDir": "www",
            "backgroundColor": "#14365d",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": false }
          }
          EOF
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: cap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renomear
        run: cp cap/android/app/build/outputs/apk/debug/app-debug.apk E-BoxHotel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: E-BoxHotel-apk
          path: E-BoxHotel.apk

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Compilar EXE
        working-directory: apps/windows
        run: |
          mkdir -p www
          cp -r ../../index.html ../../sw.js ../../manifest.webmanifest ../../assets ../../src ../../vendor www/
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../../E-BoxHotel.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: E-BoxHotel-exe
          path: E-BoxHotel.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apps-latest' }}
          name: E-BoxHotel apps
          files: |
            out/E-BoxHotel.apk
            out/E-BoxHotel.exe
